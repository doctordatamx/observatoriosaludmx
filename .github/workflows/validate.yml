name: Validar compilación y pruebas sin microdatos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m unittest discover -s tests -p test_download_recent.py
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/indicators.test.mjs tests/public.test.mjs
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
      - run: python pages/check_public.py
